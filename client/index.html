    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica o tema antes do primeiro paint (sem flash): escolha salva > preferência do sistema.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = theme;
        // Com JavaScript, a cópia pré-renderizada fica escondida até o React montar a página.
        document.documentElement.classList.add('js');
      })();
    </script>
    <style>.js [data-prerender] { display: none; }</style>

  <body>

    <script>
      // Restaura a rota salva pelo 404.html (SPA no GitHub Pages)
      (function() {
        const redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== location.pathname) {
          sessionStorage.removeItem('redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
