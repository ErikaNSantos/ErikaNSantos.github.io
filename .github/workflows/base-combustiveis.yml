# Base histórica de preços de combustíveis da ANP (2004 em diante), em Parquet.
# O código que monta a base fica em github.com/ErikaNSantos/raio-x-combustiveis (pasta base/);
# os arquivos são publicados na Release "base-combustiveis" deste repositório.
name: Base de combustíveis (ANP)

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, antes da atualização do Raio-X (12:00 UTC)
  workflow_dispatch:
    inputs:
      modo:
        description: "recente = só anos novos ou alterados (retoma execuções interrompidas); completo = refaz todos"
        type: choice
        options: [recente, completo]
        default: recente

permissions:
  contents: write

concurrency:
  group: base-combustiveis
  cancel-in-progress: false

env:
  TAG: base-combustiveis
  GH_TOKEN: ${{ github.token }}

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ErikaNSantos/raio-x-combustiveis
          path: raio-x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install duckdb pandas

      - name: Release (cria se não existir)
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Base histórica de preços de combustíveis (ANP)" \
              --notes-file raio-x/base/notas_release.md --latest=false
          fi

      - name: Manifesto atual
        working-directory: raio-x
        run: |
          mkdir -p base/parquet
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p manifesto.json -D base/parquet || true

      - name: Construir
        working-directory: raio-x
        run: |
          # Sem --refazer, só entram os anos novos ou cujos arquivos na ANP mudaram
          # (na semana a semana, o ano corrente). Uma execução que falhou continua de onde parou.
          if [ "${{ github.event.inputs.modo }}" = "completo" ]; then
            python -m base.construir --saida base/parquet --refazer
          else
            python -m base.construir --saida base/parquet
          fi

      - name: Publicar
        if: ${{ !cancelled() }}
        working-directory: raio-x
        run: |
          ls -la base/parquet
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" base/parquet/* --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file base/notas_release.md

      - name: Conferir consulta remota
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs;")
          url = "https://github.com/ErikaNSantos/erikansantos.github.io/releases/download/base-combustiveis/combustiveis_2024.parquet"
          print(con.sql(f"SELECT produto, median(preco_venda) AS mediana, count(*) AS coletas FROM '{url}' WHERE uf = 'BA' GROUP BY ALL ORDER BY ALL"))
          PY
